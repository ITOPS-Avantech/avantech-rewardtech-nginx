# =============================================================================
# ModSecurity Override Configuration
# Loaded AFTER the OWASP CRS rules so these directives take precedence.
# =============================================================================


# -----------------------------------------------------------------------------
# ENGINE MODE
# DetectionOnly → nologs violations but never blocks (safe for initial roll-out)
# On            → actively blocks requests that match CRS rules (production)
# -----------------------------------------------------------------------------
SecRuleEngine On


# -----------------------------------------------------------------------------
# REQUEST BODY HANDLING
# -----------------------------------------------------------------------------
# Limits match nginx client_max_body_size (50 MB). NoFilesLimit must be large
# because LSTU saveLSTURecognition posts a big base64 PNG as JSON (counts as
# "NoFiles"); the old 8 MB cap rejected large certificates with HTTP 400.
# nginx (client_max_body_size) and rule 9002002 still cap absolute size at 50 MB.
# NOTE: ModSecurity SecLang does NOT support inline "#" comments after a value.
# Keep each directive on its own line with no trailing comment, or it is skipped
# and the image default (128 KB NoFilesLimit) silently stays in effect.
# 52428800 = 50 MB, matching nginx client_max_body_size.
SecRequestBodyAccess On
SecRequestBodyLimit 52428800
SecRequestBodyNoFilesLimit 52428800
SecRequestBodyLimitAction ProcessPartial


# -----------------------------------------------------------------------------
# RESPONSE BODY HANDLING
# -----------------------------------------------------------------------------
SecResponseBodyAccess On
# text/html intentionally excluded: Keycloak login/redirect pages are large HTML
# responses that exceed the body limit and trigger ERR_INCOMPLETE_CHUNKED_ENCODING.
# HTML responses carry no meaningful WAF inspection value on the response side.
SecResponseBodyMimeType application/json text/plain
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial


# -----------------------------------------------------------------------------
# AUDIT LOGGING
# Log only relevant violations (not every request)
# -----------------------------------------------------------------------------
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec_audit.log


# -----------------------------------------------------------------------------
# DISABLED CRS RULES
# Loaded after setup.conf — the SecRuleRemoveById *directive* strips the rule at
# config-parse time from the merged ruleset (more reliable than ctl: actions,
# which the existing per-path rules below could not apply in time).
# -----------------------------------------------------------------------------
# 920420: "Request content type is not allowed by policy" — blocks text/plain.
# findByIncomingURL POSTs the page origin as a plain string; Spring accepts it.
SecRuleRemoveById 920420
# 920440: "URL file extension is restricted by policy" — treats the .com/.in/.org
# at the end of an email in the URL path (e.g. /LSTU/stats/user@gmail.com) as a
# forbidden file extension and 403s it. This API keys many routes by email, so the
# URL-extension check is a pure false-positive here. All other WAF rules stay on.
SecRuleRemoveById 920440


# =============================================================================
# PER-ENDPOINT EXCLUSIONS
# Keycloak and JSON APIs routinely carry tokens / payloads that look like
# attacks to generic WAF rules.  We disable the noisy rules for those paths
# rather than turning off ModSecurity entirely.
# =============================================================================

# --- /kcauth/ – Keycloak authentication endpoint ---
# Keycloak POSTs (nologin, token refresh, registration) contain Base64-encoded
# tokens and HTML-encoded values that trigger XSS / SQLi false positives.
SecRule REQUEST_URI "@beginsWith /kcauth/" \
    "id:9011001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    msg:'Keycloak auth endpoint – disable noisy CRS rules',\
    ctl:ruleEngine=Off"

# --- /rewardtech/api/ – Back-end REST API ---
# JSON request bodies may trigger generic injection rules.
# Cookie / Authorization headers contain bearer tokens that look like SQLi.
SecRule REQUEST_URI "@beginsWith /rewardtech/api/" \
    "id:9011002,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    msg:'RewardTech API – disable injection false positives',\
    ctl:ruleRemoveById=200001,\
    ctl:ruleRemoveById=200002,\
    ctl:ruleRemoveById=200003,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942190,\
    ctl:ruleRemoveById=942440,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=931130"

# --- /rewardtech/api/letssaythankyou/ – LSTU Certificate Uploads ---
# The saveLSTURecognition POST body contains a large Base64-encoded PNG image.
# Base64 data frequently triggers various XSS, SQLi, and anomaly rules.
SecRule REQUEST_URI "@beginsWith /rewardtech/api/letssaythankyou/" \
    "id:9011005,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    msg:'LSTU API – disable WAF for base64 certificate upload',\
    ctl:ruleEngine=Off"

# --- /store/ – Store front-end ---
# E-commerce pages with product search queries can trigger SQLi rules.
SecRule REQUEST_URI "@beginsWith /store/" \
    "id:9011003,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    msg:'Store endpoint – disable search query false positives',\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=941100"


# =============================================================================
# CUSTOM ALLOW / BLOCK RULES  (add your own below)
# Rule ID range reserved for this application: 9002000–9009999
# =============================================================================

# Reject absurd Content-Length before body buffering (prevents worker malloc/OOM crashes)
SecRule REQUEST_HEADERS:Content-Length "@gt 52428800" \
    "id:9002002,phase:1,deny,status:413,nolog,msg:'Content-Length exceeds 50MB'"

# GET/HEAD have no body — skip request-body inspection (common scanner abuse vector)
SecRule REQUEST_METHOD "@rx ^(?:GET|HEAD)$" \
    "id:9002003,phase:1,pass,nolog,ctl:requestBodyAccess=Off"

# Example: block a known bad User-Agent
# SecRule REQUEST_HEADERS:User-Agent "@contains evilbot" \
#     "id:9002001,phase:1,deny,status:403,nolog,msg:'Blocked bad bot'"

# Example: rate-limit  (requires nginx-plus or limit_req_zone upstream)
# – use nginx's limit_req_zone / limit_req directives in nginx.conf instead.
