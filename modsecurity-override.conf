# =============================================================================
# ModSecurity Override Configuration
# Loaded AFTER the OWASP CRS rules so these directives take precedence.
# =============================================================================


# -----------------------------------------------------------------------------
# ENGINE MODE
# DetectionOnly → logs violations but never blocks (safe for initial roll-out)
# On            → actively blocks requests that match CRS rules (production)
# -----------------------------------------------------------------------------
SecRuleEngine On


# -----------------------------------------------------------------------------
# REQUEST BODY HANDLING
# -----------------------------------------------------------------------------
SecRequestBodyAccess On
SecRequestBodyLimit 13107200          # 12.5 MB  (covers file uploads)
SecRequestBodyNoFilesLimit 1048576    # 1 MB     (for regular form/JSON data)
SecRequestBodyLimitAction Reject


# -----------------------------------------------------------------------------
# RESPONSE BODY HANDLING
# -----------------------------------------------------------------------------
SecResponseBodyAccess On
SecResponseBodyMimeType application/json text/plain text/html
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial


# -----------------------------------------------------------------------------
# AUDIT LOGGING
# Log only relevant violations (not every request)
# -----------------------------------------------------------------------------
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec_audit.log


# =============================================================================
# PER-ENDPOINT EXCLUSIONS
# Keycloak and JSON APIs routinely carry tokens / payloads that look like
# attacks to generic WAF rules.  We disable the noisy rules for those paths
# rather than turning off ModSecurity entirely.
# =============================================================================

# --- /kcauth/ – Keycloak authentication endpoint ---
# Keycloak POSTs (login, token refresh, registration) contain Base64-encoded
# tokens and HTML-encoded values that trigger XSS / SQLi false positives.
SecRule REQUEST_URI "@beginsWith /kcauth/" \
    "id:9011001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    msg:'Keycloak auth endpoint – disable noisy CRS rules',\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=941130,\
    ctl:ruleRemoveById=941160,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942190,\
    ctl:ruleRemoveById=942440,\
    ctl:ruleRemoveById=931130,\
    ctl:ruleRemoveById=920273"

# --- /rewardtech/api/ – Back-end REST API ---
# JSON request bodies may trigger generic injection rules.
# Cookie / Authorization headers contain bearer tokens that look like SQLi.
SecRule REQUEST_URI "@beginsWith /rewardtech/api/" \
    "id:9011002,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    msg:'RewardTech API – disable injection false positives',\
    ctl:ruleRemoveById=200001,\
    ctl:ruleRemoveById=200002,\
    ctl:ruleRemoveById=200003,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942190,\
    ctl:ruleRemoveById=942440,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=920440"

# --- /store/ – Store front-end ---
# E-commerce pages with product search queries can trigger SQLi rules.
SecRule REQUEST_URI "@beginsWith /store/" \
    "id:9011003,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    msg:'Store endpoint – disable search query false positives',\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=941100"


# =============================================================================
# CUSTOM ALLOW / BLOCK RULES  (add your own below)
# Rule ID range reserved for this application: 9002000–9009999
# =============================================================================

# Example: block a known bad User-Agent
# SecRule REQUEST_HEADERS:User-Agent "@contains evilbot" \
#     "id:9002001,phase:1,deny,status:403,log,msg:'Blocked bad bot'"

# Example: rate-limit  (requires nginx-plus or limit_req_zone upstream)
# – use nginx's limit_req_zone / limit_req directives in nginx.conf instead.
